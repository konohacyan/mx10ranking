name: update-wish-rank

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch rank and update CSV
        run: python fetch_rank.py

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wish_records.csv wish_growth.csv
          if ! git diff --cached --quiet; then
            git commit -m "update wish_records $(date -u +%m%d%H%M)"
            git pull --rebase
            git push
          fi

      - name: Build dist
        run: mkdir -p dist && cp index.html wish_records.csv wish_growth.csv dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mx10ranking --branch=main
