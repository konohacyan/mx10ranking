<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>许愿数趋势图 - 名侦探学院许愿池</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; background: #f5f6fa; padding: 20px; color: #333; }
  h1 { font-size: 20px; margin-bottom: 16px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; }
  /* 按功能分组：竖线分隔 + 小标签，避免十来个按钮连成一片 */
  .group { display: flex; flex-direction: column; gap: 6px; padding-left: 18px; border-left: 2px solid #edeff5; }
  .group:first-child { padding-left: 0; border-left: none; }
  .group-title { font-size: 11px; color: #8a8fa0; background: #f2f3f8; border-radius: 4px; padding: 2px 7px; align-self: flex-start; }
  .group-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: #888; }
  select, input[type="datetime-local"] { padding: 6px 10px; border: 1px solid #d0d3dc; border-radius: 6px; font-size: 14px; }
  button { padding: 7px 18px; border: none; border-radius: 6px; background: #6c5ce7; color: #fff; font-size: 14px; cursor: pointer; }
  button:hover { background: #5a4bd1; }
  button:disabled { background: #b9b3e8; cursor: default; }
  button.ghost { background: #eceafc; color: #6c5ce7; }
  /* ghost 按钮的禁用态要单独写：button.ghost 与 button:disabled 优先级相同且写在后面，
     会把通用禁用样式盖掉，导致「显示全部数据」在 1 天档置灰后看起来跟正常一样 */
  button.ghost:disabled { background: #e9eaf2; color: #b6bac9; cursor: default; }
  .status { font-size: 13px; color: #999; margin-top: 10px; }
  .chart-box { height: 63vh; overflow-x: auto; display: flex; flex-direction: column; }
  .chart-inner { flex: 1; min-height: 0; min-width: 100%; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 4px 16px; margin-bottom: 8px; }
  .chart-box h2 { font-size: 15px; color: #555; }
  .legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .legend li { display: flex; align-items: center; gap: 4px; cursor: pointer; font-size: 12px; color: #555; user-select: none; }
  .legend li.hidden { text-decoration: line-through; opacity: .5; }
  .legend .box { width: 12px; height: 12px; border-radius: 2px; }
  .hint { font-size: 12px; color: #bbb; margin-top: 6px; }
</style>
</head>
<body>
<h1>许愿数趋势图 · 《名侦探学院》主创许愿池</h1>

<div class="panel">
  <div class="controls">
    <div class="group">
      <span class="group-title">时间范围</span>
      <div class="group-row">
        <div class="field">
          <label>显示间隔</label>
          <select id="interval">
            <option value="5">5 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">1 小时</option>
            <option value="1440">1 天</option>
          </select>
        </div>
        <div class="field">
          <label>起始时间（留空 = 最早数据）</label>
          <input type="datetime-local" id="startTime">
        </div>
        <div class="field">
          <label>结束时间（留空 = 最新数据）</label>
          <input type="datetime-local" id="endTime">
        </div>
        <button id="applyBtn">应用</button>
      </div>
    </div>
    <div class="group">
      <span class="group-title">数据</span>
      <div class="group-row">
        <button class="ghost" id="refreshBtn">刷新数据</button>
        <button class="ghost" onclick="window.open('/wish_records.csv','_blank')">下载原始数据</button>
      </div>
    </div>
    <div class="group">
      <span class="group-title">显示范围</span>
      <div class="group-row">
        <button class="ghost" id="expandBtn">展开折叠</button>
      </div>
    </div>
    <div class="group">
      <span class="group-title">导出截图</span>
      <div class="group-row">
        <button class="ghost" id="shotWish">趋势图</button>
        <button class="ghost" id="shotGrowth">增数图</button>
        <button class="ghost" id="shotDaily">每日增量图</button>
      </div>
    </div>
  </div>
  <div class="status"><span id="status">正在加载数据…</span><span id="rangeNote"></span></div>
  <div class="hint">提示：点击图例可显示/隐藏某人的折线；图三点击姓名单选某人（默认选择当前票数最高者）；鼠标悬停可查看具体数值。</div>
  <div class="hint">意见反馈邮箱：KonohaCyan@163.com</div>

</div>

<div class="panel chart-box" id="chartScroll">
  <div class="chart-head">
    <h2 id="wishTitle">许愿数趋势</h2>
    <ul class="legend" id="legendWish"></ul>
  </div>
  <div class="chart-inner" id="chartInner">
    <canvas id="chart"></canvas>
  </div>
</div>

<div class="panel chart-box" id="growthScroll">
  <div class="chart-head">
    <h2 id="growthTitle">许愿数增数表</h2>
    <ul class="legend" id="legendGrowth"></ul>
  </div>
  <div class="chart-inner" id="growthInner">
    <canvas id="growthChart"></canvas>
  </div>
</div>

<div class="panel chart-box" id="dailyScroll">
  <div class="chart-head">
    <h2 id="dailyTitle">每日同时刻票数增量</h2>
    <ul class="legend" id="legendDaily"></ul>
  </div>
  <div class="chart-head">
    <ul class="legend" id="legendDayColor"></ul>
  </div>
  <div class="chart-inner" id="dailyInner">
    <canvas id="dailyChart"></canvas>
  </div>
</div>

<script>
const CSV_WISH = "wish_records.csv";
const YEAR = 2026; // 列头格式 MMDDHHMM，无年份
const PALETTE = ["#6c5ce7","#e17055","#00b894","#0984e3","#e84393","#fdcb6e","#00cec9","#d63031","#636e72","#a29bfe","#55efc4","#fab1a0"];
// 应援色指定（未列出的人用 PALETTE 兜底）
const NAME_COLORS = {
  "文韬": "#F88379",    // 珊瑚粉
  "唐九洲": "#FEA500",  // 胡萝卜色
  "周峻炜": "#004080",  // 日曜宙蓝
  "李晋晔": "#C9A0DC",  // 晔猫紫
  "火树": "#8B0000",    // 暗红
};
function colorOf(name, n) { return NAME_COLORS[name] || PALETTE[n % PALETTE.length]; }

let raw = { names: [], times: [], values: {} }; // times: Date[], values: name -> number[]（可含 null）
// 两张图共用一套控件；增速图按当前显示间隔对许愿数差分（本间隔末值 - 前一间隔末值）
const CHARTS = [
  { src: () => raw, diff: false, scrollId: "chartScroll",  innerId: "chartInner",  canvasId: "chart",       legendId: "legendWish",   titleId: "wishTitle",   yTitle: "许愿数", inst: null },
  { src: () => raw, diff: true,  scrollId: "growthScroll", innerId: "growthInner", canvasId: "growthChart", legendId: "legendGrowth", titleId: "growthTitle", yTitle: m => `新增许愿数（个/${fmtInterval(m)}）`, inst: null },
];

// 前两张图默认只渲染近 RECENT_DAYS 天：数据量上来后「列数 × 人数」的点数与画布宽度同步膨胀，
// 渲染和悬停都会变卡；更早的数据折叠起来，需要时由用户点「显示全部数据」展开。
// 第三张图按「时刻 × 天数」聚合、点数与时区分辨率绑定，不受此开关影响
const RECENT_DAYS = 3;
let showAllRange = false;

// 折叠起点：以「所选结束时间」为锚往前推 RECENT_DAYS 天；未设结束时间则以最新数据为准
function recentSince(src, end) {
  const last = src.times[src.times.length - 1];
  const anchor = end && end < last ? end : last;
  return new Date(anchor.getTime() - RECENT_DAYS * 86400000);
}

// 本图这次渲染要不要折叠：返回 null 表示画全量。
// 两种不折叠的情况 —— 用户已点「显示全部数据」；
// 以及 1 天档（一天只有一列、总列数本就很少，再折叠会凭空多出一列隔断，毫无意义）
function foldSince(intervalMin, src, end) {
  if (showAllRange || intervalMin >= 1440) return null;
  return recentSince(src, end);
}

// HTML 图例插件：canvas 被拉宽横滚时内置图例会居中跑出可视区，
// 故将图例渲染到标题行的 <ul>，固定可见；点击可隐藏/显示对应折线
const htmlLegend = {
  id: "htmlLegend",
  afterUpdate(chart, args, opts) {
    const ul = document.getElementById(opts.containerId);
    if (!ul) return;
    while (ul.firstChild) ul.firstChild.remove();
    for (const item of chart.options.plugins.legend.labels.generateLabels(chart)) {
      const li = document.createElement("li");
      if (item.hidden) li.classList.add("hidden");
      const box = document.createElement("span");
      box.className = "box";
      box.style.background = item.fillStyle;
      const text = document.createElement("span");
      text.textContent = item.text;
      li.append(box, text);
      li.onclick = () => {
        chart.setDatasetVisibility(item.datasetIndex, !chart.isDatasetVisible(item.datasetIndex));
        chart.update();
      };
      ul.appendChild(li);
    }
  }
};

// 折叠标记：在「⋯ 折叠 N 列」那一列上画淡紫阴影块 + 左右竖虚线 + 顶部文字标注，
// 让被折叠的部分是一个可视的「区域」，而不是轴上一行不显眼的小字。
// 阴影放在 beforeDatasetsDraw（盖过网格线、位于折线之下），文字与虚线放在 afterDraw（最上层）。
// 只挂在前两张图：第三张图没有这种折叠结构
const foldMarker = {
  id: "foldMarker",
  beforeDatasetsDraw(chart) {
    const idx = chart.data.labels.findIndex(l => typeof l === "string" && l.includes("折叠"));
    if (idx < 0) return;
    const { ctx, chartArea, scales } = chart;
    const x = scales.x.getPixelForValue(idx);
    const w = Math.max(24, (scales.x.getPixelForValue(idx + 1) ?? x) - x); // 一格的像素宽
    ctx.save();
    ctx.fillStyle = "rgba(108, 92, 231, 0.07)";
    ctx.fillRect(x - w / 2, chartArea.top, w, chartArea.bottom - chartArea.top);
    ctx.restore();
  },
  afterDraw(chart) {
    const idx = chart.data.labels.findIndex(l => typeof l === "string" && l.includes("折叠"));
    if (idx < 0) return;
    const { ctx, chartArea, scales } = chart;
    const x = scales.x.getPixelForValue(idx);
    const w = Math.max(24, (scales.x.getPixelForValue(idx + 1) ?? x) - x);
    ctx.save();
    // 左右两条竖虚线，圈出被折叠的格子
    ctx.strokeStyle = "rgba(108, 92, 231, 0.45)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    for (const xx of [x - w / 2, x + w / 2]) {
      ctx.beginPath();
      ctx.moveTo(xx, chartArea.top);
      ctx.lineTo(xx, chartArea.bottom);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // 文字放绘图区顶部，垫一块白色半透明底，避免被折线压住看不清
    const label = chart.data.labels[idx];
    ctx.font = '600 12px "Microsoft YaHei", system-ui, sans-serif';
    const tw = ctx.measureText(label).width;
    const pad = 6, ty = chartArea.top + 6;
    ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
    ctx.fillRect(x - tw / 2 - pad, ty - 2, tw + pad * 2, 19);
    ctx.fillStyle = "#6c5ce7";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    ctx.fillText(label, x, ty);
    ctx.restore();
  }
};

// MMDDHHMM -> Date
function parseTs(s) {
  return new Date(YEAR, +s.slice(0,2)-1, +s.slice(2,4), +s.slice(4,6), +s.slice(6,8));
}
function fmtLabel(d, intervalMin) {
  const p = n => String(n).padStart(2,"0");
  return intervalMin >= 1440
    ? `${p(d.getMonth()+1)}-${p(d.getDate())}`
    : `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtInterval(m) {
  if (m >= 1440) return (m / 1440) + " 天";
  if (m >= 60) return (m / 60) + " 小时";
  return m + " 分钟";
}

async function loadOne(url) {
  const resp = await fetch(url + "?_=" + Date.now());
  if (!resp.ok) throw new Error(url + " HTTP " + resp.status);
  const text = (await resp.text()).replace(/^﻿/, "");
  const rows = text.trim().split(/\r?\n/).map(r => r.split(","));
  const header = rows[0];
  const times = header.slice(1).map(parseTs);
  const names = [];
  const values = {};
  for (const row of rows.slice(1)) {
    const name = (row[0] || "").trim();
    if (!name) continue;
    names.push(name);
    values[name] = times.map((_, i) => {
      const v = (row[i+1] || "").trim();
      return v === "" ? null : +v;
    });
  }
  return { names, times, values };
}

async function loadCsv() {
  raw = await loadOne(CSV_WISH);
  const t = raw.times;
  document.getElementById("status").textContent =
    `数据加载完毕 （${fmtLabel(t[0],0)} ~ ${fmtLabel(t[t.length-1],0)}）`;
}

// 按间隔取整点快照：时刻恰为 intervalMin 整数倍的点各成一列（如 1 小时间隔取 14:00、15:00）
// 最新点不在网格上（如 15:57 时的 15:55）则末尾追加一列实际时刻；恰在网格上则不追加
// diff=true 时对列序列差分：本列值 - 前一列值 = 该间隔新增数（首列无前值为 null）
// since 非空时只返回该时刻之后的一段（详见末尾的折叠处理）
function resample(src, intervalMin, start, end, diff, since) {
  const colIdx = [];
  for (let i = 0; i < src.times.length; i++) {
    const t = src.times[i];
    if (start && t < start) continue;
    if (end && t > end) continue;
    if (t.getTime() % (intervalMin * 60000) === 0) colIdx.push(i);
  }
  // 最新点非整点时刻时追加（起止过滤不影响"最新"判断，直接用原始序列末尾）
  const last = src.times.length - 1;
  if (src.times[last].getTime() % (intervalMin * 60000) !== 0
      && (!end || src.times[last] <= end)) colIdx.push(last);
  const labels = colIdx.map(i => fmtLabel(src.times[i], intervalMin));
  const datasets = src.names.map((name, n) => {
    const vals = colIdx.map(i => src.values[name][i]);
    return {
      label: name,
      data: diff
        ? vals.map((v, j) => (j === 0 || v == null || vals[j-1] == null) ? null : v - vals[j-1])
        : vals,
      borderColor: colorOf(name, n),
      backgroundColor: colorOf(name, n),
      spanGaps: true,
      tension: 0, // B: 直线不贝塞尔，省插值计算
      pointRadius: 0, // C: 不画圆点，省每帧 arc 绘制；悬停时仍会显示命中点
      pointHitRadius: 8,
      borderWidth: 2,
    };
  });
  if (!since) return { labels, datasets };
  // 折叠必须放在差分「之后」：若先裁掉早期数据再求差分，视图首列的增量会因为缺少
  // 前一列而变成 null，增数图开头会出现一段空白。全量算完再截，首列仍带真实增量。
  // 折叠后 =「最早一列」+ 隔断列 +「近端若干列」：中间的列真的丢掉，用一列全 null
  // 的隔断在 X 轴上标出「⋯ 折叠 N 列」；因 spanGaps 为 true，线段会跨过隔断连到近端，
  // 那条跨度的长直线 + 隔断标签，让「这里有数据被折叠」一眼可见
  let cut = 0;
  while (cut < colIdx.length - 2 && src.times[colIdx[cut]] < since) cut++;
  // 趋势图取第 0 列（原始值本身有值）；增数图第 0 列恒为 null（首列无前值），改取第 1 列，
  // 否则「最老的一列」取不到具体内容（pointRadius 为 0，孤立点根本看不见）
  const head = diff ? 1 : 0;
  if (cut <= head + 1) return { labels, datasets }; // 中间没有可折叠的列
  const folded = cut - head - 1;
  return {
    labels: [labels[head], `⋯ 折叠 ${folded} 列`, ...labels.slice(cut)],
    datasets: datasets.map(d => ({ ...d, data: [d.data[head], null, ...d.data.slice(cut)] })),
  };
}

// 根据数据点数量选默认间隔：超过48点则升一档，自动升档最高到1小时；1天由用户手动切换
function pickDefaultInterval() {
  for (const m of [5, 30, 60]) {
    if (resample(raw, m, null, null).labels.length <= 48) return m;
  }
  return 60;
}

// ===== 第三张图：每日同时刻票数增量 =====
// X 轴 = 一天内的时刻；每人每天一条线，可跨天比对「同一时刻」
// 单选某人 → 其各日曲线高亮，其余人的曲线淡化
// 显示间隔受统一控件控制，但选「1 天」时本图最高按 1 小时显示
const DAILY = { scrollId: "dailyScroll", innerId: "dailyInner", canvasId: "dailyChart", pickerId: "legendDaily", legendColorId: "legendDayColor", titleId: "dailyTitle", inst: null, person: null };
const DAILY_TITLE = "每日同时刻票数增量";

function fmtDay(d) { const p = n => String(n).padStart(2, "0"); return `${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function fmtHM(d) { const p = n => String(n).padStart(2, "0"); return `${p(d.getHours())}:${p(d.getMinutes())}`; }
// 色阶档数固定写死为 15（活动 10/15~10/29 共 15 天），不随实际数据量缩放
const DAY_SLOTS = 15;
// 未选中者的所有曲线统一用淡灰，不再按人/按天派生淡色（避免与浅色档、与背景混淆）
const FADED_GRAY = "rgba(190,194,200,0.6)";

function hexToHsl(hex) {
  const v = parseInt(hex.replace("#", ""), 16);
  const r = ((v >> 16) & 255) / 255, g = ((v >> 8) & 255) / 255, b = (v & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  const l = (mx + mn) / 2;
  const s = d === 0 ? 0 : d / (1 - Math.abs(2 * l - 1));
  return [h, s * 100, l * 100];
}

// 由主色派生固定 15 档色阶：明度大幅拉开(±35) + 色相小幅偏移(±12°) 以增强区分度，
// 饱和度与主色调保持不变。slot 0 最亮 → slot 14 最暗
function dayRgba(hex, slot, a) {
  const [h, s] = hexToHsl(hex);
  const t = slot / (DAY_SLOTS - 1);                            // 0 .. 1
  const h2 = (h + (t - 0.5) * 24 + 360) % 360;                 // 色相 ±12°
  // 明度统一取绝对区间 86%→16%（每档 5%），不随主色深浅浮动：
  // 否则深色主色(如火树 #8B0000)向下溢出会被钳制，最暗数档挤成同色
  const l2 = 86 - t * 70;
  return `hsla(${Math.round(h2)},${Math.round(s)}%,${Math.round(l2)}%,${a})`;
}

// 把实际第 i 天(共 k 天)映射到固定 15 档色阶位置：天数少时也均匀铺满整条色阶
function daySlot(i, k) {
  return k <= 1 ? 0 : Math.round(i * (DAY_SLOTS - 1) / (k - 1));
}

// 当前总票数最高的人：直接比较总票数表最后一列（累计值单调不减，末列即当前总票数）
// 并列时保留靠前者；单元格万一为空按 -1 处理，不会被误选为第一
function topScorer(src) {
  const last = src.times.length - 1;
  return src.names.reduce((a, b) =>
    (src.values[b][last] ?? -1) > (src.values[a][last] ?? -1) ? b : a);
}

function controlValues() {
  const intervalMin = +document.getElementById("interval").value;
  const sv = document.getElementById("startTime").value;
  const ev = document.getElementById("endTime").value;
  return { intervalMin, start: sv ? new Date(sv) : null, end: ev ? new Date(ev) : null };
}

// 把时序列按「天 + 时刻」重组：X=时刻，series=[{name, ni, day, data}]
// 只取间隔对齐列，保证各天「同一时刻」口径一致可比（不追加最新非整点）
function resampleDaily(src, intervalMin, start, end) {
  const colIdx = [];
  for (let i = 0; i < src.times.length; i++) {
    const t = src.times[i];
    if (start && t < start) continue;
    if (end && t > end) continue;
    if (t.getTime() % (intervalMin * 60000) === 0) colIdx.push(i);
  }
  if (!colIdx.length) return { labels: [], days: [], series: [] };

  const pos = new Map(), daySet = new Set(), timeSet = new Set();
  colIdx.forEach((ci, k) => {
    const t = src.times[ci], d = fmtDay(t), hm = fmtHM(t);
    pos.set(d + "|" + hm, k);
    daySet.add(d); timeSet.add(hm);
  });
  const days = [...daySet].sort(), labels = [...timeSet].sort();

  // 每人沿选中列顺序求增量（首列无前值 → null）
  const inc = {};
  for (const name of src.names) {
    inc[name] = colIdx.map((ci, k) => {
      if (k === 0) return null;
      const cur = src.values[name][ci], prev = src.values[name][colIdx[k-1]];
      return (cur == null || prev == null) ? null : cur - prev;
    });
  }

  const series = [];
  src.names.forEach((name, ni) => {
    days.forEach((day, di) => {
      series.push({ name, ni, day, di, data: labels.map(hm => {
        const k = pos.get(day + "|" + hm);
        return k === undefined ? null : inc[name][k];
      }) });
    });
  });
  return { labels, days, series };
}

function renderDaily(intervalMin, start, end) {
  const eff = Math.min(intervalMin, 60); // 统一控件选「1 天」时，本图最高按 1 小时显示
  const src = raw;
  const data = resampleDaily(src, eff, start, end);
  if (!src.names.includes(DAILY.person)) DAILY.person = topScorer(src) || src.names[0] || null;
  const sel = DAILY.person;
  DAILY.days = data.days;
  // 标题带上当前选中者：本图是单选视角，标题不明示人物容易看错
  const titleEl = document.getElementById(DAILY.titleId);
  if (titleEl) titleEl.textContent = sel ? `${DAILY_TITLE} -- ${sel}` : DAILY_TITLE;

  if (DAILY.inst) DAILY.inst.destroy();
  const scroll = document.getElementById(DAILY.scrollId);
  document.getElementById(DAILY.innerId).style.width =
    Math.max(scroll.clientWidth - 40, data.labels.length * 28) + "px";

  const dayCount = data.days.length;
  const datasets = data.series.map(s => {
    const base = colorOf(s.name, s.ni), active = s.name === sel;
    const col = active ? dayRgba(base, daySlot(s.di, dayCount), 0.95) : FADED_GRAY;
    return {
      label: s.day,
      data: s.data,
      borderColor: col,
      backgroundColor: col,
      borderWidth: active ? 2 : 1,
      spanGaps: true,
      tension: 0,
      pointRadius: 0,
      pointHitRadius: 8,
      // 悬停时只在被选中的线上画点：mode:index 会激活全部曲线，
      // 若不区分，淡化线也会因 pointHoverRadius 默认值冒出圆点
      pointHoverRadius: active ? 4 : 0,
      pointHoverBorderWidth: active ? 1 : 0,
      _person: s.name,
      _di: s.di,   // 天数序号，供 tooltip 按时间先后排序
    };
  });

  DAILY.inst = new Chart(document.getElementById(DAILY.canvasId), {
    type: "line",
    data: { labels: data.labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      // 切换人物是整图重建，默认补间会让 人数×天数 条曲线（连同淡灰线）一起动一遍，
      // 既拖沓又晃眼；单选视角下换人应当即时生效
      animation: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          // 只显示被选中的那个人：该时刻「每天」的票数增量
          filter: (item) => item.dataset._person === sel && item.parsed.y != null,
          // 按天序号（即时间先后，早→晚）排序，而非按增量大小——跨天对比时
          // 顺序随数值跳动会看不出趋势
          itemSort: (a, b) => (a.dataset._di ?? 0) - (b.dataset._di ?? 0),
          callbacks: { title: (items) => (items.length ? "时刻 " + items[0].label : "") }
        }
      },
      scales: {
        x: { ticks: { autoSkip: true, maxRotation: 45 } },
        y: { title: { display: true, text: `票数增量（个/${fmtInterval(eff)}）` } }
      }
    }
  });
  renderDailyPicker();
  renderDayLegend();
}

// 人物单选器：选中者正常显示，其余划掉淡化
function renderDailyPicker() {
  const ul = document.getElementById(DAILY.pickerId);
  if (!ul) return;
  while (ul.firstChild) ul.firstChild.remove();
  raw.names.forEach((name, n) => {
    const li = document.createElement("li");
    if (name !== DAILY.person) li.classList.add("hidden");
    const box = document.createElement("span");
    box.className = "box";
    box.style.background = colorOf(name, n);
    const text = document.createElement("span");
    text.textContent = name;
    li.append(box, text);
    li.onclick = () => {
      DAILY.person = name;
      const c = controlValues();
      renderDaily(c.intervalMin, c.start, c.end);
    };
    ul.appendChild(li);
  });
}

// 日期色图例：列出当前选中者「每天」对应的颜色（由主色派生的亮→暗梯度）
function renderDayLegend() {
  const ul = document.getElementById(DAILY.legendColorId);
  if (!ul) return;
  while (ul.firstChild) ul.firstChild.remove();
  const days = DAILY.days || [];
  const base = colorOf(DAILY.person, raw.names.indexOf(DAILY.person));
  days.forEach((d, i) => {
    const li = document.createElement("li");
    const box = document.createElement("span");
    box.className = "box";
    box.style.background = dayRgba(base, daySlot(i, days.length), 1);
    const text = document.createElement("span");
    text.textContent = d;
    li.append(box, text);
    ul.appendChild(li);
  });
}

function renderOne(cfg, intervalMin, start, end) {
  const since = foldSince(intervalMin, cfg.src(), end);
  const data = resample(cfg.src(), intervalMin, start, end, cfg.diff, since);
  if (cfg.inst) cfg.inst.destroy();
  // 不抽稀：每个点约 28px，超出宽度时容器横向滚动
  // 28px 使全量 5 分钟数据的 canvas 物理宽度保持在 GPU 上限内，避免回退 CPU 渲染卡顿
  const scroll = document.getElementById(cfg.scrollId);
  document.getElementById(cfg.innerId).style.width =
    Math.max(scroll.clientWidth - 40, data.labels.length * 28) + "px";
  cfg.inst = new Chart(document.getElementById(cfg.canvasId), {
    type: "line",
    data,
    plugins: [htmlLegend, foldMarker],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false }, // 内置图例禁用，改用标题行 HTML 图例
        htmlLegend: { containerId: cfg.legendId },
        tooltip: {
          // 悬停时按许愿数/增量数（当前点数值）从大到小排序；无数据(null)的不显示
          filter: (item) => item.parsed.y != null && !Number.isNaN(item.parsed.y),
          itemSort: (a, b) => (b.parsed.y ?? -Infinity) - (a.parsed.y ?? -Infinity)
        }
      },
      scales: {
        x: { ticks: { autoSkip: true, maxRotation: 45 } }, // E: 仅标签抽稀，数据点仍全量
        y: { title: { display: true, text: typeof cfg.yTitle === "function" ? cfg.yTitle(intervalMin) : cfg.yTitle } }
      }
    }
  });
}

function render() {
  const { intervalMin, start, end } = controlValues();
  for (const cfg of CHARTS) renderOne(cfg, intervalMin, start, end);
  renderDaily(intervalMin, start, end);
  // updateRangeNote();
}

// 状态栏尾部标出前两张图当前的时间范围与数据量，并同步展开按钮的文案
function updateRangeNote() {
  const note = document.getElementById("rangeNote");
  const btn = document.getElementById("expandBtn");
  if (!note || !btn || !CHARTS[0].inst) return;
  const labels = CHARTS[0].inst.data.labels;
  const cols = labels.length;
  const people = raw.names.length;
  // 折叠是否真的生效，以「X 轴上出现了隔断列」为准，而不是单看开关：
  // 1 天档、或数据本身不足 3 天时都不会折叠
  const folded = labels.some(l => typeof l === "string" && l.includes("折叠"));
  const dayStep = +document.getElementById("interval").value >= 1440;
  btn.disabled = dayStep; // 1 天档无需折叠，按钮此时点了也没意义，直接禁用
  btn.title = dayStep ? "1 天档本身就是一天一列，无需折叠" : "";
  btn.textContent = folded ? "展开折叠" : `仅显示近 ${RECENT_DAYS} 天`;
  const head = `　前两张图：${cols} 个时间点 × ${people} 人`;
  // 列数上万时 Chart.js 掉帧明显，全量展开后给个预警
  note.textContent = folded
    ? `${head}（最早一列 + 近 ${RECENT_DAYS} 天，中间已折叠）`
    : dayStep ? `${head}（1 天档，无需折叠）`
    : `${head}${cols > 2000 ? "（数据量较大，可能卡顿）" : ""}`;
}

async function reload() {
  try {
    await loadCsv();
    document.getElementById("interval").value = pickDefaultInterval();
    render();
  } catch (e) {
    document.getElementById("status").textContent =
      "加载失败：" + e.message + "。数据每 5 分钟更新一次，请稍后刷新页面重试。";
  }
}

// 刷新：只重新拉取 CSV 并重绘。刻意不用 location.reload()——整页刷新会把用户
// 当前选的间隔、起止时间、第三张图选中的人全部重置；loadOne 带 ?_= 时间戳，能拿到新数据
async function refresh() {
  const btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  btn.textContent = "刷新中…";
  try {
    await loadCsv();   // 成功后状态栏由 loadCsv 自己更新为「已加载 N 个时间点…」
    render();
  } catch (e) {
    document.getElementById("status").textContent =
      "刷新失败：" + e.message + "。数据每 5 分钟更新一次，请稍后重试。";
  } finally {
    btn.textContent = "刷新数据";
    btn.disabled = false;
  }
}

// 导出图表 PNG：折线图透明底直接保存会变成黑块，故先铺白底；
// 页面上的标题与图例都是 HTML 元素、不在 canvas 内，所以把标题手绘到导出图顶部。
// 导出的是完整宽度，不受横向滚动影响
function exportChart(src, titleId) {
  const dpr = window.devicePixelRatio || 1;   // canvas 是物理像素，标题条需按同一比例放大
  const bar = Math.round(40 * dpr);
  const out = document.createElement("canvas");
  out.width = src.width;
  out.height = src.height + bar;
  const ctx = out.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.fillStyle = "#333";
  ctx.font = `600 ${Math.round(16 * dpr)}px "Microsoft YaHei", system-ui, sans-serif`;
  ctx.textBaseline = "middle";
  // 靠左绘制：超宽画布下居中标题会跑到图片中段、一眼看不到
  ctx.fillText(titleOf(titleId), Math.round(14 * dpr), bar / 2);
  ctx.drawImage(src, 0, bar);
  const a = document.createElement("a");
  a.href = out.toDataURL("image/png");
  a.download = `${fnameOf(titleId)}_${stamp()}.png`;
  a.click();
}

function saveChartImage(cfg) {
  const chart = cfg.inst;
  chart.options.plugins.legend.display = true;
  chart.update("none");
  exportChart(document.getElementById(cfg.canvasId), cfg.titleId);
  chart.options.plugins.legend.display = false;
  chart.update("none");
}

// 第三张图的 dataset 是「人数 × 天数」，直接开内置图例会列出全部组合（N×M 条），
// 故保存时只保留当前选中者的「每天」条目，与图下方日期色图例保持一致
function saveDailyImage() {
  const chart = DAILY.inst;
  if (!chart) return;
  const sel = DAILY.person;
  const legend = chart.options.plugins.legend;
  // 解析后的 options 未必自带 labels 子对象，按需补建、用完撤销
  const created = !legend.labels;
  const labels = created ? (legend.labels = {}) : legend.labels;
  const prevFilter = labels.filter;
  // 只列当前选中者的「每天」：否则会列出 人数×天数 条，且未选中者全为同一灰色、无从分辨
  labels.filter = item => chart.data.datasets[item.datasetIndex]._person === sel;
  legend.display = true;
  chart.update("none");
  exportChart(document.getElementById(DAILY.canvasId), DAILY.titleId);
  legend.display = false;
  if (prevFilter === undefined) delete labels.filter; else labels.filter = prevFilter;
  if (created) delete legend.labels;
  chart.update("none");
}

// 截图标题与文件名统一取自页面上的图表标题：三张图共用同一来源，改标题即同时改名
function titleOf(titleId) {
  const el = document.getElementById(titleId);
  return el ? el.textContent.trim() : "";
}
function fnameOf(titleId) {
  // 第三张图标题含「 -- 文韬」，转成下划线，避免文件名里出现空格与连续连字符
  return titleOf(titleId).replace(/\s*--\s*/g, "_") || "图表";
}

function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`;
}

document.getElementById("applyBtn").onclick = render;
document.getElementById("refreshBtn").onclick = refresh;
document.getElementById("expandBtn").onclick = () => { showAllRange = !showAllRange; render(); };
document.getElementById("shotWish").onclick = () => saveChartImage(CHARTS[0]);
document.getElementById("shotGrowth").onclick = () => saveChartImage(CHARTS[1]);
document.getElementById("shotDaily").onclick = saveDailyImage;
reload();
</script>
